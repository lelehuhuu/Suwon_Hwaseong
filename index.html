<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>금세화성진정기 | 디지털 의궤</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Serif KR","Batang",serif;color:#59452d}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 42%,#f5efe3 0,#e5dac6 60%,#d3c5ad 100%)}
.shell{width:min(100%,1480px);padding:24px clamp(12px,3vw,42px);display:flex;flex-direction:column;align-items:center;gap:14px}
.topline{width:min(100%,1366px);display:flex;justify-content:space-between;align-items:center;color:#786344;font-size:12px;letter-spacing:.18em}
.viewer{width:min(100%,1366px);aspect-ratio:1366/768;position:relative;perspective:1800px;filter:drop-shadow(0 14px 20px #6b56351c);overflow:hidden;background:#f6f0e4}
.page{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;transition:transform .68s cubic-bezier(.6,.02,.35,1),opacity .68s}
.page img{display:block;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.page.turning{transform:rotateY(-88deg);opacity:.25}
.ink-cover{position:absolute;z-index:2;left:46%;right:0;top:0;bottom:0;pointer-events:none;opacity:0;
background-color:#f4eee2;
background-image:radial-gradient(rgba(132,105,69,.075) .65px,transparent .8px),radial-gradient(rgba(132,105,69,.045) .7px,transparent .85px),linear-gradient(105deg,rgba(255,255,255,.13),rgba(206,185,151,.08));
background-size:7px 7px,13px 13px,100% 100%;background-position:0 0,4px 6px,0 0}
.ink-cover.animate{opacity:1;animation:inkReveal 1.9s cubic-bezier(.2,.65,.25,1) forwards}
@keyframes inkReveal{0%{clip-path:inset(0 0 0 0)}12%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}
.brush{position:absolute;z-index:3;left:50%;top:29%;font-size:24px;opacity:0;transform:translate(-50%,-50%) rotate(-28deg);pointer-events:none;filter:drop-shadow(1px 2px 1px #6b4b2b55)}
.brush.animate{opacity:1;animation:brushMove 1.8s cubic-bezier(.2,.65,.25,1) forwards}
@keyframes brushMove{0%{left:47%;top:29%;opacity:0}8%{opacity:1}24%{left:60%;top:37%}43%{left:73%;top:48%}62%{left:84%;top:60%}82%{left:94%;top:72%}95%{opacity:1}100%{left:99%;top:78%;opacity:0}}
.controls{width:min(100%,1366px);display:flex;align-items:center;justify-content:space-between;gap:20px}
.arrow{width:44px;height:44px;border:1px solid #927b56;border-radius:50%;background:#75603f;color:#f6efdf;font-size:25px;line-height:1;cursor:pointer;display:grid;place-items:center;transition:transform .2s,background .2s}
.arrow:hover{background:#59462c;transform:scale(1.07)}.arrow:disabled{opacity:.28;cursor:default;transform:none}
.counter{font-size:12px;letter-spacing:.22em;color:#796646}.hint{font-size:11px;color:#927e5d;letter-spacing:.08em;text-align:center}
@media(max-width:600px){.shell{padding:12px 8px}.topline{font-size:10px}.arrow{width:38px;height:38px}.hint{font-size:10px}}
@media(prefers-reduced-motion:reduce){.page,.brush,.ink-cover{animation:none!important;transition:none!important}.brush.animate,.ink-cover.animate{opacity:0}}
</style></head>
<body><main class="shell">
<header class="topline"><span>今世華城進呈記</span><span>예술공학부 20244597 이윤서</span></header>
<section class="viewer" aria-label="금세화성진정기 디지털 책"><div class="page" id="page"><img id="pageImage" src="pages/page-01.webp" alt="금세화성진정기 표지"><div class="ink-cover" id="inkCover"></div><div class="brush" id="brush">🖌</div></div></section>
<nav class="controls" aria-label="페이지 이동"><button class="arrow" id="prev" aria-label="이전 페이지">‹</button><span class="counter" id="counter">01 / 15</span><button class="arrow" id="next" aria-label="다음 페이지">›</button></nav>
<div class="hint">화살표를 눌러 책장을 넘겨보십시오 · 키보드 방향키로도 이동할 수 있습니다</div>
</main>
<script>(()=>{const total=15;let current=1,busy=false;const page=document.getElementById('page'),img=document.getElementById('pageImage'),brush=document.getElementById('brush'),ink=document.getElementById('inkCover'),counter=document.getElementById('counter'),prev=document.getElementById('prev'),next=document.getElementById('next');const src=n=>`pages/page-${String(n).padStart(2,'0')}.webp`;function update(){counter.textContent=`${String(current).padStart(2,'0')} / ${total}`;img.alt=`금세화성진정기 ${current}쪽`;prev.disabled=current===1;next.disabled=current===total}function writeOn(){ink.classList.remove('animate');brush.classList.remove('animate');void ink.offsetWidth;ink.classList.add('animate');brush.classList.add('animate')}function go(dir){if(busy)return;const t=current+dir;if(t<1||t>total)return;busy=true;ink.classList.remove('animate');brush.classList.remove('animate');page.classList.add('turning');setTimeout(()=>{current=t;img.src=src(current);update();page.classList.remove('turning');writeOn();setTimeout(()=>busy=false,1950)},340)}prev.onclick=()=>go(-1);next.onclick=()=>go(1);window.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(1)}if(e.key==='ArrowLeft'){e.preventDefault();go(-1)}});img.addEventListener('load',()=>{if(current===1)writeOn()});update();})();</script>
</body></html>
